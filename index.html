<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jarod Torun — Product &amp; Global Design Portfolio</title>
  <!-- GitHub Pages exige un index.html à la racine pour servir "/" - la
       vraie page d'accueil vit dans /home/ (index.html là-bas, jamais un
       fichier nommé "index" visible dans l'URL - demande explicite). Ce
       fichier ne fait que rediriger vers elle, le plus tôt et le plus
       silencieusement possible. window.location.replace() (pas .href) :
       n'ajoute pas d'entrée dans l'historique, donc le bouton "précédent"
       du navigateur ne revient jamais sur CETTE page intermédiaire après la
       redirection. <meta refresh> + lien manuel en repli si JS est
       désactivé (rare, mais gratuit à couvrir). -->
  <meta http-equiv="refresh" content="0; url=home/">
  <script>window.location.replace('home/');</script>
</head>
<body>
  <p><a href="home/">Continuer vers le site</a></p>
</body>
</html>
