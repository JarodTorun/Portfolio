<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Copie de l'ancien Home.html (racine) dans un vrai dossier /home/ pour
       une URL propre ("/" redirige vers "/home/", jamais "Home.html" dans la
       barre d'adresse - minuscule, comme /cv/, pour éviter le piège de casse
       de GitHub Pages : voir le commentaire de <base> plus bas). <base
       href="../"> fait résoudre tous les chemins relatifs de cette page
       (./style.css, ./script.js, cv/, les chemins d'assets construits en JS)
       comme si le document était toujours à la racine - même technique que
       /projects/<slug>/index.html. -->
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Jarod Torun — Product &amp; Global Design Portfolio</title>
  <meta name="description" content="Exploring usage, shaping materials, and designing products rooted in their environment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="overlay">
    <!-- Pas de src ni d'autoplay ici : posés en JS seulement si la
         connexion n'est pas détectée comme trop lente (voir
         isSlowConnection dans script.js) - sinon aucun téléchargement n'est
         déclenché du tout. -->
    <video id="overlay-video" muted loop playsinline preload="auto"></video>
    <div id="overlay-dim"></div>
    <div id="overlay-heading">
      <h1 id="overlay-title">Jarod Torun - Portfolio</h1>
      <p id="overlay-subtitle">design by making.</p>
    </div>
    <div id="power-switch-glow">
      <div id="power-switch-spotlight"></div>
      <button id="power-switch" type="button"><span id="power-switch-label">Discover</span></button>
    </div>
  </div>
  <div id="scene"></div>
  <!-- Nom, dans le flux normal de la page (pas fixe à l'écran, voir
       .mobile-name dans style.css) - juste avant le catalogue, donc défile
       avec lui. -->
  <p class="mobile-name">Jarod Torun</p>
  <!-- Catalogue mobile (voir buildCatalog dans script.js) : une carte par
       projet, remplie dynamiquement - vide par défaut, comme #scene sur
       desktop. -->
  <div id="catalog"></div>
  <!-- Bloc uni derrière la barre de statut iOS (horloge/réseau/batterie) -
       voir .mobile-statusbar-bg dans style.css. -->
  <div class="mobile-statusbar-bg"></div>
  <!-- Visible seulement sur mobile (voir .cv-link dans style.css, scopé à
       .is-mobile) : sur desktop, le CV reste accessible via l'objet "ID" de
       la scène interactive - pas d'équivalent mobile pour l'instant (voir
       consigne : page vierge/catalogue à construire), donc un accès
       persistant dédié. -->
  <a href="cv/" class="cv-link">CV</a>
  <!-- Accès direct au mail, sans passer par le CV (voir consigne) - icône
       seule, en haut à gauche (le CV reste à droite), page d'accueil
       uniquement. -->
  <a href="mailto:Barishtorun@hotmail.com" class="mail-link" aria-label="Envoyer un email">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </svg>
  </a>
  <script src="./script.js"></script>
</body>
</html>
