<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Copie de /projets/index.html pour une URL propre (/projets/monolith/) -
       voir le commentaire détaillé dans projets/break-shot/index.html. -->
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Projet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- wght@300 ajouté : utilisé par .cv-link/.mobile-simple-btn (voir
       style.css) - absent avant, le navigateur retombait sur 400 (plus
       épais que prévu, rendu visiblement différent de l'accueil qui charge
       bien 300). -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Tailwind via CDN (pas d'étape de build sur ce site, comme la page d'accueil à la racine).
       darkMode: 'class' pour piloter le thème nous-mêmes depuis la colonne
       "Thème" du CSV, plutôt que de suivre les préférences système. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 transition-colors duration-300">

  <!-- Bloc uni derrière la barre de statut iOS (horloge/réseau/batterie) -
       voir .mobile-statusbar-bg dans style.css. -->
  <div class="mobile-statusbar-bg"></div>

  <!-- Bouton retour, DESKTOP uniquement (caché sur mobile, voir
       .is-mobile #mobile-back-link dans style.css - remplacé là par
       #mobile-back-link-simple juste en dessous) : le texte s'efface au
       survol pendant qu'un panneau (l'icône flèche) s'étend depuis la
       gauche jusqu'à recouvrir tout le bouton (group-hover, voir Tailwind)
       - un mécanisme pensé pour la souris, sans équivalent tactile, qui
       résistait à un centrage fiable une fois simplement redimensionné
       pour mobile (voir historique). -->
  <a href="../Home/" id="mobile-back-link"
     class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
            bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
    <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Back</span>
    <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="translate-x-[2px] opacity-80" aria-hidden="true">
        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>
      </svg>
    </i>
  </a>
  <!-- Back mobile : structure simple, copiée de .mail-link (accueil) - pas
       le mécanisme hover ci-dessus, juste une flèche + texte centrés dans
       une pilule (voir .mobile-simple-btn dans style.css). -->
  <a href="../Home/" id="mobile-back-link-simple" class="mobile-simple-btn" aria-label="Retour à l'accueil">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 19-7-7 7-7"/>
      <path d="M19 12H5"/>
    </svg>
    <span>Back</span>
  </a>

  <!-- Accès direct au CV, mobile uniquement (voir .cv-link dans style.css,
       scopé à .is-mobile) - même bouton que sur l'accueil (voir index.html
       à la racine), pas d'équivalent desktop ici (le CV reste accessible
       via la scène interactive de l'accueil). -->
  <a href="../CV/" class="cv-link">CV</a>
  <!-- Bandeau sombre dégradé derrière Back/CV en haut de la page, mobile
       uniquement (voir .mobile-topbar-scrim dans style.css) - même principe
       que sur l'accueil (voir index.html à la racine). -->
  <div class="mobile-topbar-scrim"></div>

  <!-- Close, mobile uniquement : UN SEUL bouton au niveau de la page (comme
       Back/CV juste au-dessus), pas un par carte - affiché/cliqué en JS
       (voir mobilePanelClose dans setupCardStack, script.js). Un bouton
       Close niché DANS chaque panneau (voir data-card-close plus bas,
       desktop) reste plafonné visuellement par son parent sur certains
       moteurs de rendu mobiles (position: fixed imbriqué) - passait donc
       sous le bandeau ci-dessus malgré un z-index élevé posé dessus.
       Un bouton page-level, comme Back/CV (qui eux fonctionnent), n'a pas
       ce problème. Structure simple, copiée de .mail-link (accueil) - pas
       de mécanisme hover, juste une croix + texte centrés (voir
       .mobile-simple-btn dans style.css), toujours mobile-only. -->
  <button type="button" id="mobile-panel-close" style="display: none;" class="mobile-simple-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 6 6 18"/>
      <path d="m6 6 12 12"/>
    </svg>
    <span>Close</span>
  </button>

  <!-- Hero : vidéo du projet en boucle unique, fondu vers l'image fixe une
       fois la vidéo terminée (voir script.js: setupHero). -->
  <section id="hero" class="hero">
    <!-- play() appelé dès que possible en JS (voir setupHero), sans attendre
         aucun événement de chargement au préalable - c'est cet appel qui
         débloque le téléchargement sur Safari iOS (voir le commentaire
         détaillé dans script.js). Pas d'autoplay natif ici : la vidéo ne
         doit devenir visible qu'une fois "playing" reçu (voir style.css),
         jamais avant. preload="auto" : le téléchargement démarre tout de
         suite, sans attendre le clic/scroll. -->
    <video id="hero-video" class="hero-media" muted playsinline preload="auto"></video>
    <!-- L'image fixe reste CACHÉE (voir #hero-image dans style.css) tant que
         la vidéo n'a pas fini ou échoué - jamais visible avant/pendant elle.
         fetchpriority="high" quand même : doit être prête en cas d'échec de
         la vidéo, chargée avant les ressources moins prioritaires. -->
    <img id="hero-image" class="hero-media hero-image" alt="" fetchpriority="high">
  </section>

  <!-- Contenu sous le hero : à construire projet par projet (voir
       PROJECT_SECTIONS dans script.js, data-section = clé de config). Pas de
       max-w ici sur <main> : chaque section gère elle-même sa largeur (fond
       plein cadre possible), avec un wrapper interne max-w-5xl pour le texte. -->
  <main>

    <section data-section="intro" class="bg-white px-6 pb-10 pt-28 dark:bg-[#1F1F1F]">
      <div class="max-w-5xl mx-auto text-center">
        <h2 data-field="intro-title" class="font-['Montserrat'] whitespace-nowrap text-[clamp(2rem,7vw,6rem)] font-bold leading-[1.6] pb-2 text-neutral-900 dark:text-white">
          Titre du projet
        </h2>
        <p data-field="intro-subtitle" class="mt-20 text-xl font-thin text-neutral-600 dark:text-neutral-300 md:text-2xl">
          Sous-titre du projet
        </p>
      </div>
    </section>

    <!-- Pile de cartes façon carrousel (data-section="block-2") : au repos
         elles se chevauchent en pile portrait. Au survol de l'une d'elles,
         elle devient la vedette (quasi toute la hauteur/largeur de la
         section) pendant que les autres se réduisent à un simple aperçu sur
         les côtés (voir .card-row/.card dans style.css, et setupCardCarousel
         dans script.js pour la logique de survol pas-à-pas). Au clic, une
         carte s'étend en plein écran vers son panneau (voir setupCardStack
         dans script.js). Clé générique card-1/2/3/4 dans les data-* : le
         contenu réel (titre, image, présence/absence de la carte) est
         entièrement piloté par PROJECT_CONTENT/PROJECT_CARDS/CARD_IMAGES
         dans script.js, projet par projet - ces placeholders sont partagés
         par TOUS les projets. -->
    <section data-section="block-2" class="flex min-h-[75vh] flex-col justify-center bg-white px-6 py-10 dark:bg-[#1F1F1F]">

      <!-- Hors du wrapper max-w-5xl : la vedette a besoin de toute la
           largeur de la section. -->
      <div class="card-row">

        <!-- overflow-hidden est sur le wrapper INTERNE de chaque carte, pas
             sur .card : un élément clippe aussi son propre box-shadow (même
             piège que pour .hero, voir style.css), ce qui aurait rendu
             l'ombre invisible. -->
        <button type="button" data-card="card-1"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="card-1" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-1-title" class="card-title">Card 1</span>
          </div>
        </button>

        <button type="button" data-card="card-2"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="card-2" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-2-title" class="card-title">Card 2</span>
          </div>
        </button>

        <button type="button" data-card="card-3"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="card-3" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-3-title" class="card-title">Card 3</span>
          </div>
        </button>

        <button type="button" data-card="card-4"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="card-4" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-4-title" class="card-title">Card 4</span>
          </div>
        </button>

      </div>
    </section>

  </main>

  <!-- Panneaux plein écran des cartes ci-dessus : cachés par défaut (voir
       .card-panel dans style.css), un par carte, liés via data-card-panel. -->
  <div data-card-panel="card-1" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-1-title" class="card-panel-title">Card 1</h2>
    <!-- Fond du panneau : noir uni (voir .card-panel dans
         style.css), pas l'image. Ancre juste où rattacher l'image le temps
         de l'animation (pour son z-index, voir setupCardStack dans
         script.js) - sa position/taille réelle est calculée et posée en JS
         (position: fixed + top/left/width/height), ces classes ne servent
         donc qu'à documenter l'intention visuelle, pas à la mise en page
         effective. L'image elle-même n'existe qu'une fois, dans la carte
         (voir plus haut) : setupCardStack la déplace physiquement ici au
         clic. -->
    <div class="image-container-target"></div>
    <!-- Texte + vidéo optionnels, à droite de l'image : vides par défaut
         pour tous les projets/cartes (voir applyContent/setupCardVideos
         dans script.js), remplis seulement là où un projet le demande. -->
    <div class="card-panel-body">
      <div class="card-panel-body-row">
        <div class="card-panel-body-main">
          <p data-field="card-1-body" class="card-panel-text"></p>
          <!-- Image carrée secondaire optionnelle (voir CARD_SECONDARY_IMAGE
               dans script.js), sous le texte. Vide par défaut. -->
          <div data-card-secondary-image="card-1" class="card-panel-secondary-image"></div>
          <!-- Paire d'images optionnelle, côte à côte (voir CARD_IMAGE_ROW
               dans script.js), sous le texte. Vide par défaut. -->
          <div data-card-image-row="card-1" class="card-panel-image-row"></div>
          <div data-card-video="card-1" class="card-panel-video"></div>
          <!-- Carousel d'images optionnel (voir CARD_GALLERY_IMAGES dans
               script.js) : DANS .card-panel-body-main, pas à côté - prend la
               largeur de cette colonne (pas celle du panneau entier) et reste
               dans son budget de hauteur (max-height + overflow-y: auto), sans
               quoi le panneau dépasse la fenêtre et fait défiler toute la
               page. Vide par défaut. -->
          <div data-card-gallery="card-1" class="card-gallery"></div>
          <!-- Carrousel "slide" optionnel (une image à la fois, flèches +
               points de progression, voir CARD_SLIDE_CAROUSEL dans
               script.js) : DANS .card-panel-body-main comme .card-gallery
               ci-dessus, même raison (largeur de la colonne, budget de
               hauteur du panneau). Vide par défaut. -->
          <div data-card-slide-carousel="card-1" class="card-panel-slide-carousel"></div>
        </div>
        <!-- Tableau technique interactif optionnel (voir CARD_SPEC_TABLE dans
             script.js) : SIBLING de .card-panel-body-main, pas dedans - prend
             l'autre colonne (.card-panel-body-row passe en flex dès qu'il
             n'est pas vide, voir style.css), à côté du texte/de l'image
             plutôt qu'en dessous. Vide par défaut. -->
        <div data-card-spec-table="card-1" class="card-panel-spec-table"></div>
        <!-- Paire d'images empilées optionnelle (voir CARD_IMAGE_COLUMN dans
             script.js) : SIBLING de .card-panel-body-main, prend l'autre
             colonne comme .card-panel-spec-table ci-dessus. Vide par défaut. -->
        <div data-card-image-column="card-1" class="card-panel-image-column"></div>
        <!-- Lecteur audio optionnel (voir CARD_AUDIO_PLAYER dans script.js) :
             SIBLING de .card-panel-body-main, prend l'autre colonne comme
             .card-panel-spec-table/-image-column ci-dessus. Vide par défaut. -->
        <div data-card-audio-player="card-1" class="card-panel-audio-player"></div>
      </div>
      <!-- Image pleine largeur optionnelle (voir CARD_WIDE_IMAGE dans
           script.js) : SIBLING de .card-panel-body-row, sous le texte ET les
           colonnes ci-dessus, prend toute la largeur de la section plutôt
           qu'une seule colonne. Vide par défaut. -->
      <div data-card-wide-image="card-1" class="card-panel-wide-image"></div>
    </div>
  </div>

  <div data-card-panel="card-2" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-2-title" class="card-panel-title">Card 2</h2>
    <div class="image-container-target"></div>
    <div class="card-panel-body">
      <div class="card-panel-body-row">
        <div class="card-panel-body-main">
          <p data-field="card-2-body" class="card-panel-text"></p>
          <div data-card-secondary-image="card-2" class="card-panel-secondary-image"></div>
          <div data-card-image-row="card-2" class="card-panel-image-row"></div>
          <div data-card-video="card-2" class="card-panel-video"></div>
          <div data-card-gallery="card-2" class="card-gallery"></div>
          <div data-card-slide-carousel="card-2" class="card-panel-slide-carousel"></div>
        </div>
        <div data-card-spec-table="card-2" class="card-panel-spec-table"></div>
        <div data-card-image-column="card-2" class="card-panel-image-column"></div>
        <div data-card-audio-player="card-2" class="card-panel-audio-player"></div>
      </div>
      <div data-card-wide-image="card-2" class="card-panel-wide-image"></div>
    </div>
  </div>

  <div data-card-panel="card-3" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-3-title" class="card-panel-title">Card 3</h2>
    <div class="image-container-target"></div>
    <div class="card-panel-body">
      <div class="card-panel-body-row">
        <div class="card-panel-body-main">
          <p data-field="card-3-body" class="card-panel-text"></p>
          <div data-card-secondary-image="card-3" class="card-panel-secondary-image"></div>
          <div data-card-image-row="card-3" class="card-panel-image-row"></div>
          <div data-card-video="card-3" class="card-panel-video"></div>
          <div data-card-gallery="card-3" class="card-gallery"></div>
          <div data-card-slide-carousel="card-3" class="card-panel-slide-carousel"></div>
        </div>
        <div data-card-spec-table="card-3" class="card-panel-spec-table"></div>
        <div data-card-image-column="card-3" class="card-panel-image-column"></div>
        <div data-card-audio-player="card-3" class="card-panel-audio-player"></div>
      </div>
      <div data-card-wide-image="card-3" class="card-panel-wide-image"></div>
    </div>
  </div>

  <div data-card-panel="card-4" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-4-title" class="card-panel-title">Card 4</h2>
    <div class="image-container-target"></div>
    <div class="card-panel-body">
      <div class="card-panel-body-row">
        <div class="card-panel-body-main">
          <p data-field="card-4-body" class="card-panel-text"></p>
          <div data-card-secondary-image="card-4" class="card-panel-secondary-image"></div>
          <div data-card-image-row="card-4" class="card-panel-image-row"></div>
          <div data-card-video="card-4" class="card-panel-video"></div>
          <div data-card-gallery="card-4" class="card-gallery"></div>
          <div data-card-slide-carousel="card-4" class="card-panel-slide-carousel"></div>
        </div>
        <div data-card-spec-table="card-4" class="card-panel-spec-table"></div>
        <div data-card-image-column="card-4" class="card-panel-image-column"></div>
        <div data-card-audio-player="card-4" class="card-panel-audio-player"></div>
      </div>
      <div data-card-wide-image="card-4" class="card-panel-wide-image"></div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
