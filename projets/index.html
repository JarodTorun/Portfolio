<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind via CDN (pas d'étape de build sur ce site, comme la page d'accueil à la racine).
       darkMode: 'class' pour piloter le thème nous-mêmes depuis la colonne
       "Thème" du CSV, plutôt que de suivre les préférences système. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 transition-colors duration-300">

  <!-- Bouton retour : le texte s'efface au survol pendant qu'un panneau
       (l'icône flèche) s'étend depuis la gauche jusqu'à recouvrir tout le
       bouton (group-hover, voir Tailwind). -->
  <a href="../index.html"
     class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
            bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
    <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Back</span>
    <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="translate-x-[2px] opacity-80" aria-hidden="true">
        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>
      </svg>
    </i>
  </a>

  <!-- Hero : vidéo du projet en boucle unique, fondu vers l'image fixe une
       fois la vidéo terminée (voir script.js: setupHero). -->
  <section id="hero" class="hero">
    <video id="hero-video" class="hero-media" muted autoplay playsinline preload="auto"></video>
    <img id="hero-image" class="hero-media hero-image" alt="">
  </section>

  <!-- Contenu sous le hero : à construire projet par projet (voir
       PROJECT_SECTIONS dans script.js, data-section = clé de config). Pas de
       max-w ici sur <main> : chaque section gère elle-même sa largeur (fond
       plein cadre possible), avec un wrapper interne max-w-5xl pour le texte. -->
  <main>

    <section data-section="intro" class="bg-white px-6 pb-10 pt-28 dark:bg-[#1F1F1F]">
      <div class="max-w-5xl mx-auto text-center">
        <h2 data-field="intro-title" class="font-['Montserrat'] whitespace-nowrap text-[clamp(2rem,7vw,6rem)] font-bold leading-[1.6] pb-2 text-neutral-900 dark:text-white">
          Titre du projet
        </h2>
        <p data-field="intro-subtitle" class="mt-20 text-xl font-thin text-neutral-600 dark:text-neutral-300 md:text-2xl">
          Sous-titre du projet
        </p>
      </div>
    </section>

    <section data-section="block-2" class="flex min-h-[75vh] flex-col justify-center bg-white px-6 py-10 dark:bg-[#1F1F1F]">

      <!-- Pile de cartes façon carrousel : au repos elles se chevauchent en
           pile portrait. Au survol de l'une d'elles, elle devient la vedette
           (quasi toute la hauteur/largeur de la section) pendant que les
           autres se réduisent à un simple aperçu sur les côtés (voir
           .card-row/.card dans style.css, sélecteur :has() pour affecter les
           cartes NON survolées depuis le survol d'une seule d'entre elles).
           Hors du wrapper max-w-5xl : la vedette a besoin de toute la
           largeur de la section. Au clic, une carte s'étend en plein écran
           vers son panneau (voir setupCardStack dans script.js). -->
      <div class="card-row">

        <!-- overflow-hidden est sur le wrapper INTERNE de chaque carte, pas
             sur .card : un élément clippe aussi son propre box-shadow (même
             piège que pour .hero, voir style.css), ce qui aurait rendu
             l'ombre invisible. -->
        <button type="button" data-card="concept"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="concept" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-concept-title" class="card-title">Card 1</span>
          </div>
        </button>

        <button type="button" data-card="prototyping"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="prototyping" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-prototyping-title" class="card-title">Card 2</span>
          </div>
        </button>

        <button type="button" data-card="gravity-feed"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="gravity-feed" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-gravity-feed-title" class="card-title">Card 3</span>
          </div>
        </button>

        <button type="button" data-card="illumination"
                class="card group relative shrink-0 rounded-2xl text-left shadow-[0_30px_70px_-8px_rgba(0,0,0,0.9)]">
          <div class="h-full w-full overflow-hidden rounded-2xl bg-[#141414]">
            <img data-card-image="illumination" class="h-full w-full rounded-lg object-cover" decoding="async" alt="">
            <span data-field="card-illumination-title" class="card-title">Card 4</span>
          </div>
        </button>

      </div>
    </section>

  </main>

  <!-- Panneaux plein écran des cartes ci-dessus : cachés par défaut (voir
       .card-panel dans style.css), un par carte, liés via data-card-panel. -->
  <div data-card-panel="concept" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-concept-title" class="card-panel-title">Card 1</h2>
    <!-- Fond du panneau : noir uni (voir .card-panel dans
         style.css), pas l'image. Ancre juste où rattacher l'image le temps
         de l'animation (pour son z-index, voir setupCardStack dans
         script.js) - sa position/taille réelle est calculée et posée en JS
         (position: fixed + top/left/width/height), ces classes ne servent
         donc qu'à documenter l'intention visuelle, pas à la mise en page
         effective. L'image elle-même n'existe qu'une fois, dans la carte
         (voir plus haut) : setupCardStack la déplace physiquement ici au
         clic. -->
    <div class="image-container-target"></div>
    <!-- Texte + vidéo optionnels, à droite de l'image : vides par défaut
         pour tous les projets/cartes (voir applyContent/setupCardVideos
         dans script.js), remplis seulement là où un projet le demande. -->
    <div class="card-panel-body">
      <p data-field="card-concept-body" class="card-panel-text"></p>
      <div data-card-video="concept" class="card-panel-video"></div>
    </div>
  </div>

  <div data-card-panel="prototyping" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-prototyping-title" class="card-panel-title">Card 2</h2>
    <div class="image-container-target"></div>
    <div class="card-panel-body">
      <p data-field="card-prototyping-body" class="card-panel-text"></p>
      <div data-card-video="prototyping" class="card-panel-video"></div>
    </div>
  </div>

  <div data-card-panel="gravity-feed" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-gravity-feed-title" class="card-panel-title">Card 3</h2>
    <div class="image-container-target"></div>
    <div class="card-panel-body">
      <p data-field="card-gravity-feed-body" class="card-panel-text"></p>
      <div data-card-video="gravity-feed" class="card-panel-video"></div>
    </div>
  </div>

  <div data-card-panel="illumination" class="card-panel" hidden>
    <button type="button" data-card-close
            class="group fixed top-6 left-6 z-50 flex items-center overflow-hidden rounded-full
                   bg-black/60 text-sm tracking-wide text-white backdrop-blur transition-colors hover:bg-black/80">
      <span class="py-2 pl-11 pr-4 transition-opacity duration-500 group-hover:opacity-0">Close</span>
      <i class="not-italic absolute inset-y-0 left-0 z-10 grid w-[25px] place-items-center bg-white/25 transition-all duration-500 group-hover:w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="opacity-80" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </i>
    </button>
    <h2 data-field="card-illumination-title" class="card-panel-title">Card 4</h2>
    <div class="image-container-target"></div>
    <div class="card-panel-body">
      <p data-field="card-illumination-body" class="card-panel-text"></p>
      <div data-card-video="illumination" class="card-panel-video"></div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
